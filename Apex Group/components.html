<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Components</title>
    </head>
    <body>
        <!-- <header class="header">

        </header> -->
        <main>
            <div class="header__container">

            </div>
            <div class="title">Designs
                That Inspire
            </div>
            <a href="#"
                class="header__button header__button button button--icon-arrow">
                <span>Contact Us</span>
            </a>
            <div class="product__card card-product">
                <a href="#" class="product__link">
                    <img src="images/project/cart1.jpg" alt="image"
                        class="product__image">
                </a>
                <div class="product__body">
                    <h3 class="product__title">Architectural <br> Design</h3>
                    <div class="product__text">
                        <p>Crafting innovative and functional designs, from
                            residential homes to commercial spaces, tailored to
                            meet your unique needs.</p>
                    </div>
                </div>
            </div>

            <div class="hero__slider slider-hero">
                <div class="slider-hero__wrapper">
                    <div class="slider-hero__slide">
                        <img
                            src="images/hero/slide1.jpg"
                            alt="design interior 1"
                            class="slider-hero__image">
                    </div>
                    <div
                        class="slider-hero__slide "><img
                            src="images/hero/slide2.jpg"
                            alt="design interior 2"
                            class="slider-hero__image"></div>
                    <div
                        class="slider-hero__slide "><img
                            src="images/hero/slide3.jpg"
                            alt="design interior 3"
                            class="slider-hero__image"></div>
                    <div
                        class="slider-hero__slide "><img
                            src="images/hero/slide4.jpg"
                            alt="design interior 4"
                            class="slider-hero__image"></div>
                    <div
                        class="slider-hero__slide "><img
                            src="images/hero/slide5.jpg"
                            alt="design interior 5"
                            class="slider-hero__image"></div>
                    <div
                        class="slider-hero__slide "><img
                            src="images/hero/slide6.jpg"
                            alt="design interior 6"
                            class="slider-hero__image"></div>

                </div>

            </div>
        </main>
        <footer></footer>
        <script src="js/script.js"></script>
    </body>
</html>
